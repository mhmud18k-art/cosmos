<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmos — معاينة التصميم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Same tokens as src/index.css — this file is the design system, standalone. */
  :root{
    --void:#05060d; --surface:#0c0e1a; --surface-2:#141830; --surface-3:#1c2145;
    --violet:#7c3aed; --violet-soft:#a78bfa; --indigo:#4338ca; --celeste:#5fd8ff;
    --ink:#f8fafc; --ink-muted:#94a3b8;
    --hairline:rgba(255,255,255,.08); --hairline-strong:rgba(255,255,255,.16);
    --heading:"Readex Pro","IBM Plex Sans Arabic",sans-serif; --display:"IBM Plex Sans Arabic",system-ui,sans-serif; --mono:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .tabular{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:inherit;text-decoration:none}
  :where(a,button):focus-visible{outline:2px solid var(--celeste);outline-offset:2px;border-radius:4px}

  .glow-violet{box-shadow:0 0 0 1px rgba(167,139,250,.14),0 0 24px -6px rgba(124,58,237,.5),0 0 64px -24px rgba(124,58,237,.4)}
  .text-glow{text-shadow:0 0 28px rgba(167,139,250,.45)}
  .nebula{background-image:radial-gradient(60% 50% at 15% 0%,rgba(67,56,202,.28),transparent 70%),radial-gradient(50% 45% at 85% 10%,rgba(124,58,237,.22),transparent 70%)}

  /* ── hero ── */
  .hero{position:relative;isolation:isolate;height:88vh;min-height:640px;overflow:hidden;background:#000}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%}
  .hero-copy{position:relative;z-index:10;height:100%;display:flex;align-items:center;padding:0 5vw}
  .hero-copy > div{max-width:36rem}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--celeste);margin-bottom:1.25rem}
  h1,h2,h3{font-family:var(--heading);letter-spacing:-.015em}
  h1{font-weight:300;font-size:clamp(2.5rem,5.5vw,4rem);line-height:1.1;letter-spacing:-.02em}
  .lede{margin-top:1.5rem;max-width:28rem;color:var(--ink-muted)}
  .btns{margin-top:2.25rem;display:flex;flex-wrap:wrap;gap:.75rem}
  .btn{display:flex;align-items:center;height:48px;padding:0 1.75rem;border-radius:999px;font-size:.875rem;font-weight:500;transition:.2s}
  .btn-primary{background:var(--ink);color:var(--void)}
  .btn-primary:hover{background:rgba(255,255,255,.9)}
  .btn-ghost{border:1px solid var(--hairline-strong);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--violet-soft);color:var(--violet-soft)}

  /* ── sections ── */
  section.pad{padding:5rem 5vw}
  .wrap{max-width:72rem;margin:0 auto}
  h2{font-weight:300;font-size:clamp(1.75rem,3vw,2.25rem);letter-spacing:-.02em}
  .sub{margin-top:.75rem;color:var(--ink-muted);max-width:36rem}

  /* ── planet cards ── */
  .grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:3rem;list-style:none}
  .card{display:block;height:100%;padding:1rem;border-radius:.75rem;border:1px solid var(--hairline);
        background:linear-gradient(160deg,#0c0e1a 0%,#141830 100%);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
  .card:hover{transform:translateY(-4px)}
  .pwrap{height:11rem;display:flex;align-items:center;justify-content:center;margin-bottom:.25rem}
  .stars{display:none;height:9rem;display:grid;grid-template-columns:repeat(18,1fr);gap:1px;padding:.25rem;margin-bottom:.5rem}
  .stars i{width:1px;height:1px;border-radius:50%;background:#666;justify-self:center;align-self:center;display:block}
  .card:hover .stars i{background:#fff;box-shadow:0 0 4px 1px rgba(95,216,255,.7)}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
  .card h3{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
  .card .en{font-family:var(--mono);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-muted);margin-top:.1rem;direction:ltr;text-align:start}
  /* When the secondary name is the Arabic one, the Latin treatment has to come
     off: letter-spacing breaks the cursive joins and uppercase means nothing. */
  .card .en.as-arabic{font-family:var(--display);letter-spacing:normal;text-transform:none;font-size:.8rem;direction:rtl}
  /* The number and its unit must never split across lines. */
  .card dd{white-space:nowrap}

  .chip{flex-shrink:0;border-radius:999px;padding:.25rem .6rem;font-size:11px;font-weight:500;margin-top:.25rem}
  .card .tag{margin-top:.75rem;font-size:.875rem;color:var(--ink-muted)}
  .card dl{margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--hairline);display:grid;grid-template-columns:1fr 1fr;gap:.375rem 1rem;font-family:var(--mono);font-size:.72rem}
  /* Label above value: side by side, a wide value like "142,984 km" outgrew
     its half of the grid and printed over the next column. */
  .card dl > div{min-width:0}
  .card dt{color:var(--ink-muted)}
  .card dd{margin-top:.25rem;overflow:hidden;text-overflow:ellipsis}

  /* ── table ── */
  .tablewrap{margin-top:2rem;border:1px solid var(--hairline);border-radius:.75rem;overflow:hidden;background:rgba(12,14,26,.6)}
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  thead th{height:44px;padding:0 1rem;text-align:start;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);border-bottom:1px solid var(--hairline);white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--hairline);transition:background .2s}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:rgba(20,24,48,.6)}
  tbody th{padding:.75rem 1rem;text-align:start;font-weight:400;color:var(--ink-muted)}
  tbody td{padding:.75rem 1rem}
  td.val{font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.unit{color:var(--ink-muted);font-size:.8rem}

  /* ── swatches ── */
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-top:2rem;list-style:none}
  .sw{border:1px solid var(--hairline);border-radius:.6rem;overflow:hidden}
  .sw .chipbox{height:64px}
  .sw .meta{padding:.6rem .75rem;font-family:var(--mono);font-size:.7rem}
  .sw .meta b{display:block;font-weight:500;color:var(--ink)}
  .sw .meta span{color:var(--ink-muted)}

  .note{margin-top:1rem;font-size:.8rem;color:var(--ink-muted)}
  hr.sep{border:0;border-top:1px solid var(--hairline);margin:0 5vw}

  /* Language switch */
  .langbar{position:fixed;top:14px;inset-inline-start:14px;z-index:99;display:flex;gap:2px;
    padding:2px;border:1px solid rgba(255,255,255,.10);border-radius:999px;
    background:rgba(12,14,26,.82);backdrop-filter:blur(12px)}
  .langbar button{min-width:44px;height:36px;padding:0 12px;border:0;border-radius:999px;
    background:transparent;color:#94a3b8;font:inherit;font-size:13px;cursor:pointer;
    transition:background .2s,color .2s}
  .langbar button:hover{color:#f8fafc}
  /* Filled, not just brighter: state is never carried by colour alone. */
  .langbar button[aria-pressed="true"]{background:#1c2145;color:#f8fafc;font-weight:500}
  .langbar button:focus-visible{outline:2px solid #5fd8ff;outline-offset:2px}
</style>
</head>
<body>

<!-- Language switch. The whole page flips direction with it. -->
<div class="langbar" role="group" aria-label="Language">
  <button type="button" data-lang="ar" lang="ar">ع</button>
  <button type="button" data-lang="en" lang="en">EN</button>
</div>

<!-- ═══ HERO — the 21st.dev Orbital Hero Section, same canvas maths ═══ -->
<section class="hero">
  <canvas id="orbit" aria-hidden="true"></canvas>
  <div class="hero-copy">
    <div>
      <p class="eyebrow" data-t="home.eyebrow"></p>
      <h1 class="text-glow" data-t2="home.title1|home.title2"></h1>
      <p class="lede" data-t="home.lede"></p>
      <div class="btns">
        <a class="btn btn-primary" href="#planets" data-t="home.ctaPlanets"></a>
        <a class="btn btn-ghost" href="#data" data-t="home.ctaTimeline"></a>
      </div>
    </div>
  </div>
</section>

<!-- ═══ PLANET CARDS ═══ -->
<section class="pad nebula" id="planets">
  <div class="wrap">
    <h2 data-t="planets.title"></h2>
    <p class="sub" data-p="cards"></p>
    <ul class="grid" id="cards"></ul>
  </div>
</section>

<hr class="sep">

<!-- ═══ DATA TABLE ═══ -->
<section class="pad" id="data">
  <div class="wrap">
    <h2 data-p="tableTitle"></h2>
    <p class="sub" data-p="tableSub"></p>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th scope="col" data-t="detail.colProperty"></th>
          <th scope="col" data-t="detail.colValue"></th>
          <th scope="col" data-t="detail.colUnit"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="note" data-t="detail.tableSource"></p>
  </div>
</section>

<hr class="sep">

<!-- ═══ PALETTE ═══ -->
<section class="pad">
  <div class="wrap">
    <h2 data-p="paletteTitle"></h2>
    <p class="sub" data-p="paletteSub"></p>
    <ul class="swatches" id="swatches"></ul>
    <p class="note" data-p="fonts"></p>
  </div>
</section>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Orbital hero — the same algorithm as src/components/ui/orbital-hero-section.tsx
   (21st.dev · @yura), types stripped so it runs with no build step.
   Real J2000 orbital elements, Kepler's equation, helical wakes.
   ══════════════════════════════════════════════════════════════════════════ */
const SOLAR_SYSTEM=[
 {name:"Mercury",a:.3871,e:.20563,i:7.005,node:48.331,peri:29.125,M0:174.796,color:"#fff0d0",size:2.2},
 {name:"Venus",a:.72333,e:.00677,i:3.395,node:76.68,peri:54.853,M0:50.115,color:"#ffc65a",size:3.4},
 {name:"Earth",a:1,e:.01671,i:0,node:348.739,peri:114.208,M0:357.517,color:"#5fd8ff",size:3.8,glow:1.1},
 {name:"Mars",a:1.52371,e:.09339,i:1.85,node:49.558,peri:286.483,M0:19.373,color:"#ff4a32",size:2.9},
 {name:"Jupiter",a:5.2029,e:.04839,i:1.303,node:100.464,peri:273.867,M0:20.02,color:"#ffa62e",size:5.4},
 {name:"Saturn",a:9.537,e:.05386,i:2.485,node:113.665,peri:339.392,M0:317.02,color:"#ffd884",size:4.8},
 {name:"Uranus",a:19.1913,e:.04726,i:.773,node:74.006,peri:98.999,M0:142.238,color:"#7fe6ff",size:4.2},
 {name:"Neptune",a:30.069,e:.00859,i:1.77,node:131.784,peri:276.336,M0:256.228,color:"#3f7dff",size:4.4}];
const PLANE_FAN=[[58,35],[27,145],[71,250],[40,80],[84,190],[33,310],[62,120],[15,20]];
const ECC_FAN=[.52,.34,.63,.44,.3,.58,.4,.68];
const TAU=Math.PI*2, RAD=Math.PI/180;

const CFG={yearSeconds:16,trailYears:2.6,compress:.42,maxTurns:3,planeSpread:1,eccentricity:.25,
 alignToCourse:1,driftSpeed:1.5,apex:[272,53],viewRadius:3.2,tilt:45,spin:252,roll:13.5,lead:.12,
 /* RTL: the copy sits on the right, so the art has to sit on the left and the
    scrim has to darken the right. Getting these two the same way round is what
    makes the headline collide with the orbits. */
 focus:[.28,.45],scrim:"right",scrimStrength:.92,starCount:1500,glow:1,showOrbits:true,
 showSunTrack:true,sunColor:"#FFF2CC"};

function eccentricAnomaly(M,e){let m=M%TAU;if(m<0)m+=TAU;let E=m+e*Math.sin(m)*(1+e*Math.cos(m));
 for(let k=0;k<8;k++){const s=(E-e*Math.sin(E)-m)/(1-e*Math.cos(E));E-=s;if(Math.abs(s)<1e-10)break}return E}
function parseRGB(c){c=c.trim();if(c[0]==="#"){const h=c.slice(1),f=h.length===3?h[0]+h[0]+h[1]+h[1]+h[2]+h[2]:h.slice(0,6),n=parseInt(f,16);return[(n>>16)&255,(n>>8)&255,n&255]}return[255,255,255]}
function mulberry32(seed){let t=seed>>>0;return()=>{t+=0x6d2b79f5;let x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296}}

(function(){
const canvas=document.getElementById("orbit"), host=canvas.parentElement, ctx=canvas.getContext("2d",{alpha:false});
const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let width=0,height=0,dpr=1,years=reduced?1.7:0,lastFrame=0,raf=0;
let pxPerAU=1,cx=0,cy=0,camDist=1,dist=0;
const RIGHT={x:1,y:0,z:0},UP={x:0,y:1,z:0},FWD={x:0,y:0,z:1},DIR={x:0,y:0,z:0};
const P={x:0,y:0,depth:0,s:0,ok:false},R3={x:0,y:0,z:0};

function setCamera(yaw,pitch,roll){const A=yaw*RAD,B=pitch*RAD,ca=Math.cos(A),sa=Math.sin(A),cb=Math.cos(B),sb=Math.sin(B);
 const rx=ca,ry=sa,rz=0,ux=-sa*cb,uy=ca*cb,uz=sb;FWD.x=sa*sb;FWD.y=-ca*sb;FWD.z=cb;
 const C=roll*RAD,cr=Math.cos(C),sr=Math.sin(C);
 RIGHT.x=rx*cr+ux*sr;RIGHT.y=ry*cr+uy*sr;RIGHT.z=rz*cr+uz*sr;
 UP.x=-rx*sr+ux*cr;UP.y=-ry*sr+uy*cr;UP.z=-rz*sr+uz*cr}
function setApex(lon,lat){const l=lon*RAD,b=lat*RAD;DIR.x=Math.cos(b)*Math.cos(l);DIR.y=Math.cos(b)*Math.sin(l);DIR.z=Math.sin(b)}
function project(dx,dy,dz){const vx=dx*RIGHT.x+dy*RIGHT.y+dz*RIGHT.z,vy=dx*UP.x+dy*UP.y+dz*UP.z,vz=dx*FWD.x+dy*FWD.y+dz*FWD.z;
 const depth=camDist-vz;if(depth<.6){P.ok=false;return}const s=camDist/depth;
 P.x=cx+vx*pxPerAU*s;P.y=cy-vy*pxPerAU*s;P.depth=depth;P.s=s;P.ok=true}

function swingToCourse(nx,ny,nz,align){const s=nx*DIR.x+ny*DIR.y+nz*DIR.z>=0?1:-1;
 let tx=nx+align*(s*DIR.x-nx),ty=ny+align*(s*DIR.y-ny),tz=nz+align*(s*DIR.z-nz);
 const tl=Math.hypot(tx,ty,tz);if(tl<1e-9)return null;tx/=tl;ty/=tl;tz/=tl;
 let ax=ny*tz-nz*ty,ay=nz*tx-nx*tz,az=nx*ty-ny*tx;const al=Math.hypot(ax,ay,az);if(al<1e-9)return null;
 ax/=al;ay/=al;az/=al;const c=Math.max(-1,Math.min(1,nx*tx+ny*ty+nz*tz)),sA=al>1?1:al,k=1-c;
 return[c+ax*ax*k,ax*ay*k-az*sA,ax*az*k+ay*sA,ay*ax*k+az*sA,c+ay*ay*k,ay*az*k-ax*sA,az*ax*k-ay*sA,az*ay*k+ax*sA,c+az*az*k]}

function elementsOf(p,index,gamma,spread,ecc,align){const aDraw=Math.pow(p.a,gamma),period=Math.pow(aDraw,1.5);
 const fan=PLANE_FAN[index%PLANE_FAN.length],inc=(p.i+spread*fan[0])*RAD,node=(p.node+spread*fan[1])*RAD;
 const target=ECC_FAN[index%ECC_FAN.length],ci=Math.cos(inc),si=Math.sin(inc),cn=Math.cos(node),sn=Math.sin(node);
 return{p,rgb:parseRGB(p.color),e:Math.min(.85,p.e+ecc*(target-p.e)),period,n:TAU/period,
  cw:Math.cos(p.peri*RAD),sw:Math.sin(p.peri*RAD),ci,si,cn,sn,M0:p.M0*RAD,
  swing:align>0?swingToCourse(si*sn,-si*cn,ci,align):null}}

function helio(el,M,gamma){const e=el.e,E=eccentricAnomaly(M,e);
 const xo=el.p.a*(Math.cos(E)-e),yo=el.p.a*Math.sqrt(1-e*e)*Math.sin(E);
 const x1=xo*el.cw-yo*el.sw,y1=xo*el.sw+yo*el.cw,y2=y1*el.ci,z2=y1*el.si;
 let x=x1*el.cn-y2*el.sn,y=x1*el.sn+y2*el.cn,z=z2;const S=el.swing;
 if(S){const rx=S[0]*x+S[1]*y+S[2]*z,ry=S[3]*x+S[4]*y+S[5]*z,rz=S[6]*x+S[7]*y+S[8]*z;x=rx;y=ry;z=rz}
 if(gamma!==1){const r=Math.sqrt(x*x+y*y+z*z);if(r>1e-9){const s=Math.pow(r,gamma-1);x*=s;y*=s;z*=s}}
 R3.x=x;R3.y=y;R3.z=z}

let D_NEAR=60,D_FAR=1400,sx=[],sy=[],sz=[],sMag=[],sPhase=[],sTint=[],starN=0,rand=mulberry32(0xc0ffee);
function seedStar(k,depth,edge){const d=depth??D_NEAR*Math.pow(D_FAR/D_NEAR,Math.pow(rand(),.55));
 const halfW=width*.5*1.15,halfH=height*.5*1.15;let ox,oy;
 if(edge===0){ox=-halfW;oy=(rand()*2-1)*halfH}else if(edge===1){ox=halfW;oy=(rand()*2-1)*halfH}
 else if(edge===2){ox=(rand()*2-1)*halfW;oy=-halfH}else if(edge===3){ox=(rand()*2-1)*halfW;oy=halfH}
 else{ox=(rand()*2-1)*halfW;oy=(rand()*2-1)*halfH}
 const scale=d/(camDist*pxPerAU),vx=ox*scale,vy=-oy*scale,vz=camDist-d;
 sx[k]=vx*RIGHT.x+vy*UP.x+vz*FWD.x+DIR.x*dist;
 sy[k]=vx*RIGHT.y+vy*UP.y+vz*FWD.y+DIR.y*dist;
 sz[k]=vx*RIGHT.z+vy*UP.z+vz*FWD.z+DIR.z*dist;
 sMag[k]=Math.pow(rand(),2.4);sPhase[k]=rand()*TAU;const t=rand();sTint[k]=t>.9?1:t<.08?2:0}
function buildStars(){starN=Math.max(60,Math.round(CFG.starCount*Math.min(2,width*height/(1440*900))));
 sx=new Float64Array(starN);sy=new Float64Array(starN);sz=new Float64Array(starN);
 sMag=new Float64Array(starN);sPhase=new Float64Array(starN);sTint=new Uint8Array(starN);
 rand=mulberry32(0xc0ffee);for(let k=0;k<starN;k++)seedStar(k)}

const glowCache=new Map();
function glowSprite(color){if(glowCache.has(color))return glowCache.get(color);
 const R=64,c=document.createElement("canvas");c.width=c.height=R*2;const g=c.getContext("2d");
 const[r,gg,b]=parseRGB(color),grad=g.createRadialGradient(R,R,0,R,R,R);
 grad.addColorStop(0,"rgba(255,255,255,1)");grad.addColorStop(.15,`rgba(${r},${gg},${b},0.95)`);
 grad.addColorStop(.36,`rgba(${r},${gg},${b},0.26)`);grad.addColorStop(.66,`rgba(${r},${gg},${b},0.05)`);
 grad.addColorStop(1,`rgba(${r},${gg},${b},0)`);g.fillStyle=grad;g.fillRect(0,0,R*2,R*2);
 glowCache.set(color,c);return c}

function layout(){pxPerAU=Math.min(width,height)*.5/CFG.viewRadius;camDist=CFG.viewRadius*3.1;
 D_NEAR=camDist*5;D_FAR=camDist*120;setApex(CFG.apex[0],CFG.apex[1]);setCamera(CFG.spin,CFG.tilt,CFG.roll)}
function resize(){const r=host.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);
 dpr=Math.min(window.devicePixelRatio||1,2);if(w===width&&h===height)return;
 width=w;height=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);layout();buildStars()}

let elems=[];
function drawSun(k,t){const[r,g,b]=parseRGB(CFG.sunColor);const pulse=1+Math.sin(t*2.1)*.02;
 const R=Math.max(5,Math.min(width,height)*.013)*pulse;
 const haze=ctx.createRadialGradient(cx,cy,0,cx,cy,R*14);
 haze.addColorStop(0,`rgba(${r},${g},${b},${.05*k})`);haze.addColorStop(.4,`rgba(255,190,110,${.014*k})`);
 haze.addColorStop(1,"rgba(255,160,80,0)");ctx.fillStyle=haze;ctx.beginPath();ctx.arc(cx,cy,R*14,0,TAU);ctx.fill();
 const outer=ctx.createRadialGradient(cx,cy,0,cx,cy,R*4.6);
 outer.addColorStop(0,`rgba(${r},${g},${b},${.34*k})`);outer.addColorStop(.3,`rgba(255,222,160,${.1*k})`);
 outer.addColorStop(.62,`rgba(255,196,110,${.025*k})`);outer.addColorStop(1,"rgba(255,180,90,0)");
 ctx.fillStyle=outer;ctx.beginPath();ctx.arc(cx,cy,R*4.6,0,TAU);ctx.fill();

   const back=CFG.driftSpeed*age;project(R3.x-DIR.x*back,R3.y-DIR.y*back,R3.z-DIR.z*back);
   xs[q]=P.x;ys[q]=P.y;ok[q]=P.ok?1:0;
   if(q===N&&P.ok)shots.push({el,x:P.x,y:P.y,depth:P.depth,s:P.s})}

   <div><h3>${esc(pick(p.name))}</h3>
    <p class="en${lang === "ar" ? "" : " as-arabic"}" dir="${lang === "ar" ? "ltr" : "rtl"}">${esc(other)}</p></div>
   <span class="chip" style="color:${p.color};background:${p.color}1f;box-shadow:inset 0 0 0 1px ${p.color}33">${esc(pick(p.type))}</span>
  </div>
  <p class="tag">${esc(pick(p.tagline))}</p>
  <dl><div><dt>${esc(t("card.diameter"))}</dt><dd>${esc(num(p.data.diameterKm))} ${esc(t("unit.km"))}</dd></div>
      <div><dt>${esc(t("card.moons"))}</dt><dd>${esc(num(p.data.moons))}</dd></div></dl>
 </a></li>`;
  }).join("");

  document.querySelectorAll("canvas[data-slug]").forEach((cv, i) => {
    const slug = cv.dataset.slug;
    const r = RENDER[slug];
    const p = PLANETS.find((x) => x.slug === slug);
    renderPlanet(cv, {
      color: p.color,
      kind: r.kind,
      size: r.rings ? 200 : 140,
      tilt: r.tilt,
      rings: !!r.rings,
      rot: i * 0.17,
    });
  });

  /* ── table (Saturn) ────────────────────────────────────────────────── */
  const saturn = PLANETS.find((p) => p.slug === "saturn");
  document.getElementById("tbody").innerHTML = DATA_LABELS.map(({ key, label, unitKey }) => {
    const raw = saturn.data[key];
    let v;
    if (key === "atmosphere" || key === "moonsAsOf") v = pick(raw);
    else if (typeof raw === "string") v = digits(raw);
    else if (key === "rotationHours" && raw < 0) v = t("detail.retrograde", { v: num(Math.abs(raw)) });
    else v = num(raw);
    return `<tr><th scope="row">${esc(pick(label))}</th>
      <td class="val"><bdi>${esc(v)}</bdi></td>
      <td class="unit">${unitKey ? esc(t(unitKey)) : "—"}</td></tr>`;
  }).join("");

  /* ── palette, with contrast measured live ──────────────────────────── */
  document.getElementById("swatches").innerHTML = SWATCHES.map(([name, hex, use]) => {
    const r = ratio(hex, "#05060d");
    const isText = r >= 4.5;
    return `<li class="sw"><div class="chipbox" style="background:${hex}"></div>
     <div class="meta"><b>${esc(pick(name))}</b><span>${hex.toUpperCase()} · ${esc(pick(use))}</span>
     <span style="color:${isText ? "#5fd8ff" : "#94a3b8"}"><bdi>${r.toFixed(1)}:1</bdi> ${isText ? "✓ AA" : "— " + esc(pick(PREVIEW.bgOnly))}</span></div></li>`;
  }).join("");
}

document.querySelectorAll(".langbar button").forEach((b) => {
  b.addEventListener("click", () => applyLang(b.dataset.lang));
});

applyLang(document.documentElement.lang === "en" ? "en" : "ar");

</script>
</body>
</html>
